plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cleanlook.continuewatching'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cleanlook.continuewatching'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with the debug key, like the launcher.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No libraries in the APK. Test only: plain JVM tests in src/test (org.json because the
    // org.json stubs inside android.jar throw on the JVM).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
